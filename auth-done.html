<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Signing you in · Countrex</title>
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;font-family:Arial,Helvetica,sans-serif;background:#fff;color:#1A0B2E}
  html[data-theme="dark"] body{background:#0C0B0D;color:#EDE8F3}
</style>
<script>(function(){try{var t=(JSON.parse(localStorage.getItem("countrex_settings")||"{}").theme)||"light";if(t==="system")t=matchMedia("(prefers-color-scheme:dark)").matches?"dark":"light";if(t==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}})();</script>
</head>
<body>
<p id="m">Signing you in…</p>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script>
(async function () {
  // Where to go once the account is fully set up (set by the button on login/signup)
  var next = "index.html";
  try { next = sessionStorage.getItem("cx_next") || next; sessionStorage.removeItem("cx_next"); } catch (e) {}
  if (["index.html","efootball.html","codm.html","eafc.html","community.html","events.html","wallet.html","settings.html","about.html"].indexOf(next) < 0) next = "index.html";

  if (typeof supabaseClient === "undefined") { document.getElementById("m").textContent = "Setup problem: js/supabase.js did not load."; return; }

  // supabase-js reads the session from the URL on load; give it a moment
  var res = await supabaseClient.auth.getSession();
  var session = res.data && res.data.session;
  if (!session) {
    await new Promise(function (r) { setTimeout(r, 800); });
    session = (await supabaseClient.auth.getSession()).data.session;
  }
  if (!session) { location.replace("login.html"); return; }

  var md = session.user.user_metadata || {};
  // returning player -> straight in. New Google player -> pick a username first.
  location.replace(md.signup_done ? next : "signup.html?google=1&next=" + encodeURIComponent(next));
})();
</script>
</body>
</html>
