<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Countrex Admin</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&display=swap" rel="stylesheet">
<script>(function(){try{if(localStorage.getItem("cx_admin_theme")==="dark")document.documentElement.setAttribute("data-theme","dark")}catch(e){}})();</script>
<style>
/*
  COUNTREX ADMIN. Every action here is checked again by the database (admin role + RLS + the admin_* functions),
  so hiding or editing this page in the browser cannot give anybody extra power.
  Needs next to it: js/supabase.js (your Supabase url + publishable key), login.html
  Database: run 001, 002 and 003_admin.sql in Supabase first.
*/
:root{--accent:#5E3C88;--r:14px;--deep:#fff;--side:#F6F2FB;--card:#fff;--field:#F6F2FB;--line:#DDD4EA;--text:#1A0B2E;--muted:#6A5F7C;--ok:#1E8E5A;--warn:#A8620A;--bad:#C0213F;--tint:var(--accent);--hover:color-mix(in srgb,var(--accent),#fff 14%);--pad:16px}
[data-theme=dark]{--deep:#120720;--side:#1A0B2E;--card:#21113A;--field:#2B1950;--line:#3B2862;--text:#fff;--muted:#BDB2D4;--ok:#5FD39A;--warn:#F2B84B;--bad:#FF6B86;--tint:color-mix(in srgb,var(--accent),#fff 50%)}
*{box-sizing:border-box;margin:0;padding:0}
[hidden]{display:none!important}
body{font-family:"Bricolage Grotesque",system-ui,sans-serif;background:var(--deep);color:var(--text);line-height:1.45;-webkit-font-smoothing:antialiased}
button{font-family:inherit;cursor:pointer;color:inherit}
:focus-visible{outline:3px solid var(--tint);outline-offset:2px}
.app{display:grid;grid-template-columns:minmax(0,1fr);min-height:100vh}
.app>div{min-width:0}
.side{position:fixed;inset:0 20% 0 0;max-width:270px;background:var(--side);border-right:1px solid var(--line);padding:18px 14px;overflow:auto;z-index:20;transform:translateX(-100%);transition:transform .2s}
.side.open{transform:none}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:22px;letter-spacing:-.02em;padding:4px 8px 14px}
.mark{width:34px;height:34px;border-radius:9px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:22px;height:22px;fill:#fff}
.grp{margin-top:14px;padding:0 10px 6px;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted)}
.nav{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;border-radius:calc(var(--r)*.7);background:none;font-size:15px;font-weight:500;color:var(--muted);text-align:left;position:relative}
.ic,.nav svg{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.nav:hover{color:var(--text);background:var(--field)}
.nav[aria-current=page]{background:var(--accent);color:#fff}
.nav .dot{margin-left:auto;min-width:20px;height:20px;border-radius:99px;background:var(--bad);color:#fff;font-size:12px;font-weight:700;display:grid;place-items:center;padding:0 6px}
.top{position:sticky;top:0;z-index:10;display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--deep);border-bottom:1px solid var(--line)}
.top h1{font-size:20px;font-weight:700;letter-spacing:-.01em;margin-right:auto}
.ib{width:40px;height:40px;border-radius:calc(var(--r)*.7);border:1px solid var(--line);background:none;display:grid;place-items:center}
.me{display:none;align-items:center;gap:10px;font-size:14px;color:var(--muted)}
.av{width:34px;height:34px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-weight:700;color:#fff}
main{padding:16px;max-width:1200px;width:100%}
.grid{display:grid;gap:14px}
.stats{grid-template-columns:1fr 1fr}
.two{grid-template-columns:1fr}
.box{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:var(--pad);min-width:0;box-shadow:0 1px 3px rgba(26,11,46,.06);margin-bottom:14px}
.grid .box{margin-bottom:0}
.box h2{font-size:17px;font-weight:700;margin-bottom:10px}
.stat b{display:block;font-size:26px;font-weight:800;letter-spacing:-.02em;overflow-wrap:anywhere}
.stat span{color:var(--muted);font-size:14px}
.stat small{display:block;color:var(--muted);font-size:12px;margin-top:2px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:calc(var(--r)*.7);padding:10px 18px;font-size:15px;font-weight:600;background:var(--accent);color:#fff}
.btn:hover{background:var(--hover)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sec{background:var(--field);color:var(--text);border:1px solid var(--line)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.bad{background:none;border:1px solid var(--bad);color:var(--bad)}
.btn.dangerb{background:var(--bad)}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.hd h2{margin:0}
.q{display:flex;gap:10px;margin-bottom:12px;flex-wrap:wrap}
.q input,.q select{flex:1;min-width:140px;width:auto}
.qk{display:flex;gap:10px;flex-wrap:wrap}
form{display:grid;gap:12px}
label{display:block;font-size:13px;font-weight:600;margin-bottom:5px;color:var(--muted)}
input,select,textarea{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:calc(var(--r)*.7);background:var(--field);color:var(--text);font-family:inherit;font-size:15px}
input:disabled,select:disabled{opacity:.6}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent),transparent 78%)}
small.mut{display:block;margin-top:4px}
.chk{display:flex;align-items:center;gap:10px;font-size:15px;color:var(--text)}
.chk input{width:20px;height:20px;accent-color:var(--accent)}
.bd{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600;border:1px solid;white-space:nowrap}
.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.mut{color:var(--muted)}
.err{color:var(--bad);font-size:14px;font-weight:600}
.empty{color:var(--muted);padding:18px 0;text-align:center;font-size:15px}
.tw{overflow:auto;border:1px solid var(--line);border-radius:var(--r)}
table{border-collapse:collapse;width:100%;font-size:14px;min-width:560px}
th{text-align:left;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);padding:10px 12px;background:var(--side);position:sticky;top:0;white-space:nowrap}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;white-space:nowrap}
tr.click:hover td{background:var(--field)}
.pg{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px;color:var(--muted);font-size:14px}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.wd{border:1px solid var(--line);border-radius:var(--r);padding:14px;margin-bottom:12px;display:grid;gap:10px;background:var(--card)}
.wd .row{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:baseline}
.wd b.big{font-size:22px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:14px;margin-bottom:14px}
.kv dt{color:var(--muted)}
.kv dd{font-weight:600;overflow-wrap:anywhere}
.alert{border:1px solid var(--warn);background:color-mix(in srgb,var(--warn),transparent 88%);border-radius:var(--r);padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.chip{display:inline-flex;gap:8px;align-items:center;background:var(--field);border:1px solid var(--line);border-radius:99px;padding:4px 6px 4px 12px;font-size:13px;font-weight:600}
.chip button{border:0;background:none;font-size:16px;line-height:1;padding:2px 6px}
.msg{padding:10px 0;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between}
.msg:last-child{border-bottom:0}
.msg p{overflow-wrap:anywhere;font-size:14px}
dialog{border:1px solid var(--line);border-radius:var(--r);background:var(--card);color:var(--text);padding:20px;width:min(560px,calc(100% - 24px));margin:auto;max-height:92vh;overflow:auto}
dialog::backdrop{background:rgba(26,11,46,.55)}
dialog h2{margin-bottom:14px;font-size:19px}
.fa{display:flex;gap:10px;justify-content:flex-end;margin-top:4px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--accent);color:#fff;padding:10px 18px;border-radius:10px;font-weight:600;z-index:50;max-width:calc(100% - 24px)}
.toast.bad{background:var(--bad)}
.gate{min-height:100vh;display:grid;place-items:center;padding:24px;text-align:center}
.gate .box{max-width:420px}
.gate p{color:var(--muted);margin:8px 0 16px}
.rm{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}.rm h4{margin:0 0 8px;font-size:15px}.rm .rg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}.rm .pl{display:flex;flex-wrap:wrap;gap:6px 14px;margin:8px 0}.rm .pl label{display:flex;gap:6px;align-items:center;font-size:14px}dialog.wide{width:min(720px,calc(100% - 24px))}
.pay{display:grid;grid-template-columns:auto 1fr 1fr 1fr;gap:8px;align-items:center;margin-bottom:8px}
.pay input{padding:8px 10px}
@media(min-width:640px){.stats{grid-template-columns:repeat(4,1fr)}main{padding:24px}}
@media(min-width:1000px){.app{grid-template-columns:260px minmax(0,1fr)}.side{position:sticky;top:0;height:100vh;inset:auto;max-width:none;transform:none}.ib.m{display:none}.me{display:flex}.two{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="gate" id="gate"><div class="box"><h2>Countrex Admin</h2><p>Checking your access…</p></div></div>
<div class="app" id="app" hidden>
  <aside class="side" id="side" aria-label="Admin menu">
    <div class="logo"><span class="mark"><svg viewBox="0 0 24 24"><path d="M7.5 6h9c2.6 0 4.2 2 4.9 5.6l.8 4.6c.3 1.9-.7 3.3-2.3 3.3-1 0-1.7-.5-2.4-1.5l-1-1.5H9.5l-1 1.5c-.7 1-1.4 1.5-2.4 1.5-1.6 0-2.6-1.4-2.3-3.3l.8-4.6C3.3 8 4.9 6 7.5 6Z"/></svg></span><span>Countrex</span></div>
    <nav id="nav"></nav>
  </aside>
  <div>
    <header class="top">
      <button class="ib m" id="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <h1 id="title">Dashboard</h1>
      <div class="me"><span id="who">Admin</span><span class="av" id="av">A</span></div>
      <button class="btn sec sm" id="out">Sign out</button>
    </header>
    <main id="main"></main>
  </div>
</div>
<dialog id="dlg"><h2 id="dt"></h2><div id="db"></div></dialog>
<div id="toast" class="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="js/supabase.js"></script>
<script>
(function () {
  "use strict";
  var sb = window.supabaseClient || null;
  var $ = function (i) { return document.getElementById(i) };
  var esc = function (s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c] }) };

  // ---------- small helpers ----------
  // Money is stored as whole pesewas (1000 = GHS 10.00). These two convert between what you see and what is stored.
  function money(n) { n = Number(n || 0); var neg = n < 0; n = Math.abs(n); return (neg ? "-" : "") + "GHS " + (n / 100).toLocaleString("en-GB", { minimumFractionDigits: 2, maximumFractionDigits: 2 }) }
  function toMinor(v) { var s = String(v == null ? "" : v).replace(/[,\s]/g, ""); if (!/^-?\d+(\.\d{1,2})?$/.test(s)) return NaN; return Math.round(parseFloat(s) * 100) }
  function fdate(s) { if (!s) return "–"; var d = new Date(s); return isNaN(d) ? "–" : d.toLocaleString("en-GB", { day: "numeric", month: "short", year: "numeric", hour: "2-digit", minute: "2-digit" }) }
  function fday(s) { if (!s) return "–"; var d = new Date(s); return isNaN(d) ? "–" : d.toLocaleDateString("en-GB", { day: "numeric", month: "short", year: "numeric" }) }
  function toLocalInput(iso) { if (!iso) return ""; var d = new Date(iso); if (isNaN(d)) return ""; var p = function (n) { return String(n).padStart(2, "0") }; return d.getFullYear() + "-" + p(d.getMonth() + 1) + "-" + p(d.getDate()) + "T" + p(d.getHours()) + ":" + p(d.getMinutes()) }
  function num(n) { return Number(n || 0).toLocaleString("en-GB") }
  var toastT;
  function toast(m, bad) { var t = $("toast"); t.textContent = m; t.className = "toast" + (bad ? " bad" : ""); t.hidden = false; clearTimeout(toastT); toastT = setTimeout(function () { t.hidden = true }, bad ? 5000 : 2600) }
  async function q(p) { var r = await p; if (r.error) { var e = new Error(r.error.message || "Request failed"); e.code = r.error.code; throw e } return r.data }
  var rpc = function (n, a) { return q(sb.rpc(n, a || {})) };
  function fail(e) { console.error(e); var m = e && e.message ? e.message : "Something went wrong"; if (/room_size|advance_per_room|prize_1|prize_2|prize_3|tournament_rooms|admin_set_room|admin_start_final|admin_finish_final|admin_set_qualifiers|admin_close_signup/.test(m) && /column|function|relation|schema cache/i.test(m)) m = "Run 009_rooms.sql in Supabase first, then try again."; if (/tournament_codes/.test(m)) m = "Run 008_tournament_codes.sql in Supabase first, then try again."; if (/cover_url/.test(m)) m = "Run 006_event_covers.sql in Supabase first, then try again."; toast(m, true) }
  function badge(text, cls) { return '<span class="bd ' + (cls || "mut") + '">' + esc(text) + "</span>" }
  var STATUS = { active: "ok", suspended: "warn", banned: "bad", completed: "ok", pending: "warn", failed: "bad", open: "ok", live: "warn", draft: "mut", finished: "mut", cancelled: "bad", unused: "ok", used: "mut", revoked: "bad" };
  var stBadge = function (s) { return badge(s, STATUS[s] || "mut") };
  var KIND = { deposit: "Deposit", entry_fee: "Entry fee", prize: "Prize", withdrawal: "Withdrawal", refund: "Refund", adjustment: "Adjustment" };
  var GAMES = [["codm", "Call of Duty: Mobile"], ["eafc", "EA SPORTS FC"], ["efootball", "eFootball"]];
  var gameName = function (k) { for (var i = 0; i < GAMES.length; i++) if (GAMES[i][0] === k) return GAMES[i][1]; return k || "–" };

  function table(cols, rows, opts) {
    opts = opts || {};
    if (!rows.length) return '<p class="empty">' + esc(opts.empty || "Nothing here yet.") + "</p>";
    return '<div class="tw"><table><thead><tr>' + cols.map(function (c) { return '<th class="' + (c.n ? "n" : "") + '">' + esc(c.h) + "</th>" }).join("") + "</tr></thead><tbody>" +
      rows.map(function (r, i) { return "<tr" + (opts.row ? " " + opts.row(r, i) : "") + ">" + cols.map(function (c) { return '<td class="' + (c.n ? "n" : "") + '">' + c.r(r, i) + "</td>" }).join("") + "</tr>" }).join("") + "</tbody></table></div>";
  }
  function pager(total, off, lim) {
    if (!total) return "";
    var to = Math.min(off + lim, total);
    return '<div class="pg"><span>' + (off + 1) + "–" + to + " of " + num(total) + '</span><span class="acts"><button class="btn sec sm" data-pg="-1"' + (off <= 0 ? " disabled" : "") + '>Previous</button><button class="btn sec sm" data-pg="1"' + (to >= total ? " disabled" : "") + ">Next</button></span></div>";
  }
  function main(html) { $("main").innerHTML = html }

  // ---------- dialogs ----------
  var dlg = $("dlg");
  function openDlg(title, html) { $("dt").textContent = title; $("db").innerHTML = html; if (!dlg.open) dlg.showModal() }
  function closeDlg() { if (dlg.open) dlg.close() }
  function fieldHtml(f) {
    var id = "f_" + f.k, v = f.v == null ? "" : f.v, h;
    if (f.t === "checkbox") return '<label class="chk"><input type="checkbox" id="' + id + '"' + (f.v ? " checked" : "") + (f.dis ? " disabled" : "") + "> " + esc(f.l) + "</label>";
    if (f.t === "file") return '<div><label for="' + id + '">' + esc(f.l) + "</label>" + (f.v ? '<img src="' + esc(f.v) + '" alt="Current cover" style="display:block;width:100%;max-height:170px;object-fit:cover;border-radius:10px;margin-bottom:8px">' : "") + '<input id="' + id + '" type="file" accept="image/jpeg,image/png,image/webp">' + (f.hint ? '<small class="mut">' + esc(f.hint) + "</small>" : "") + "</div>";
    h = '<div><label for="' + id + '">' + esc(f.l) + (f.req ? " *" : "") + "</label>";
    if (f.t === "textarea") h += '<textarea id="' + id + '"' + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : "") + ">" + esc(v) + "</textarea>";
    else if (f.t === "select") h += '<select id="' + id + '"' + (f.dis ? " disabled" : "") + ">" + f.opts.map(function (o) { return '<option value="' + esc(o[0]) + '"' + (String(o[0]) === String(v) ? " selected" : "") + ">" + esc(o[1]) + "</option>" }).join("") + "</select>";
    else h += '<input id="' + id + '" type="' + (f.t === "number" ? "number" : f.t === "datetime" ? "datetime-local" : "text") + '" value="' + esc(v) + '"' + (f.t === "money" ? ' inputmode="decimal"' : "") + (f.t === "number" && f.min != null ? ' min="' + f.min + '"' : "") + (f.ph ? ' placeholder="' + esc(f.ph) + '"' : "") + (f.dis ? " disabled" : "") + ' autocomplete="off">';
    if (f.hint) h += '<small class="mut">' + esc(f.hint) + "</small>";
    return h + "</div>";
  }
  function readForm(fields) {
    var o = {};
    fields.forEach(function (f) {
      var el = $("f_" + f.k); if (!el) return;
      if (f.t === "checkbox") { o[f.k] = el.checked; return }
      if (f.t === "file") { o[f.k] = (el.files && el.files[0]) || null; return }
      var v = String(el.value).trim();
      if (f.req && !v && !f.dis) throw new Error(f.l + " is required");
      if (f.t === "number") o[f.k] = v === "" ? null : Number(v);
      else if (f.t === "money") { o[f.k] = v === "" ? null : toMinor(v); if (v !== "" && isNaN(o[f.k])) throw new Error(f.l + ": type an amount like 25 or 25.50") }
      else if (f.t === "datetime") o[f.k] = v ? new Date(v).toISOString() : null;
      else o[f.k] = v;
    });
    return o;
  }
  function form(title, fields, label, onSubmit, opts) {
    opts = opts || {};
    openDlg(title, (opts.intro ? '<p class="mut" style="margin-bottom:12px;font-size:14px">' + opts.intro + "</p>" : "") + '<form id="df" novalidate>' + fields.map(fieldHtml).join("") +
      '<p class="err" id="ferr" hidden></p><div class="fa"><button type="button" class="btn sec" data-close>Cancel</button><button class="btn' + (opts.danger ? " dangerb" : "") + '" type="submit">' + esc(label) + "</button></div></form>");
    $("df").onsubmit = async function (e) {
      e.preventDefault();
      var b = e.submitter || $("df").querySelector("button[type=submit]"); b.disabled = true; $("ferr").hidden = true;
      try { await onSubmit(readForm(fields)); closeDlg() }
      catch (x) { $("ferr").textContent = x.message || "Something went wrong"; $("ferr").hidden = false; b.disabled = false }
    };
  }
  function confirmDlg(title, html, label, danger) {
    return new Promise(function (res) {
      openDlg(title, '<p style="margin-bottom:16px;line-height:1.5">' + html + '</p><div class="fa"><button class="btn sec" data-close>Cancel</button><button class="btn' + (danger ? " dangerb" : "") + '" id="cy">' + esc(label) + "</button></div>");
      $("cy").onclick = function () { res(true); closeDlg() };
      dlg.addEventListener("close", function h() { dlg.removeEventListener("close", h); res(false) });
    });
  }

  // ---------- state ----------
  var me = null, cur = "dash", cache = {}, views = {}, acts = {}, pageFn = null;
  var NAV = [
    ["Overview", [["dash", "Dashboard", "M3 12 12 4l9 8v8a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-8Z"]]],
    ["People & money", [["players", "Players", "M16 11a4 4 0 1 0-8 0M4 21a8 8 0 0 1 16 0"], ["wallet", "Wallet", "M3 7h16a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Zm0 0V6a2 2 0 0 1 2-2h12M16 14h2"]]],

  var COVER_BUCKET = "tournament-covers";
  async function uploadCover(file) {
    if (!/^image\/(jpeg|png|webp)$/.test(file.type)) throw new Error("The cover must be a JPG, PNG or WebP picture");
    if (file.size > 15 * 1024 * 1024) throw new Error("That picture is too big (15 MB at most)");
    var bmp; try { bmp = await createImageBitmap(file) } catch (e) { throw new Error("Could not read that picture") }
    var sc = Math.min(1, 1280 / bmp.width), w = Math.max(1, Math.round(bmp.width * sc)), h = Math.max(1, Math.round(bmp.height * sc));
    var c = document.createElement("canvas"); c.width = w; c.height = h;
    var x = c.getContext("2d"); x.fillStyle = "#fff"; x.fillRect(0, 0, w, h); x.drawImage(bmp, 0, 0, w, h);
    var blob = await new Promise(function (r) { c.toBlob(r, "image/jpeg", 0.85) });
    if (!blob) throw new Error("Could not process that picture");
    var path = "covers/" + crypto.randomUUID() + ".jpg";
    var r = await sb.storage.from(COVER_BUCKET).upload(path, blob, { contentType: "image/jpeg", cacheControl: "31536000", upsert: false });
    if (r.error) throw new Error(/bucket/i.test(r.error.message || "") ? "The cover storage is not set up yet. Run 004_covers.sql in Supabase." : (r.error.message || "Upload failed"));
    return sb.storage.from(COVER_BUCKET).getPublicUrl(path).data.publicUrl;
  }

      { h: "Event", r: function (e) { return '<div style="display:flex;gap:10px;align-items:center">' + (e.cover_url ? '<img src="' + esc(e.cover_url) + '" alt="" style="width:64px;height:36px;object-fit:cover;border-radius:6px;flex:none">' : "") + "<div><b>" + esc(e.name) + '</b><br><small class="mut">' + esc(e.category) + "</small></div></div>" } },

      { h: "Prize", r: function (e) { return esc(e.prize || "–") } },
      { h: "Joined", n: 1, r: function (e) { return e.n + (e.join_limit ? " / " + e.join_limit : "") } },
      { h: "", r: function (e) { return '<div class="acts"><button class="btn sec sm" data-act="eedit" data-id="' + e.id + '">Edit</button><button class="btn bad sm" data-act="edel" data-id="' + e.id + '">Delete</button></div>' } }
    ], rows, { empty: "No events yet." }) + "</div>");
  };
  function evtFields(e) {
    e = e || {};
    return [{ k: "name", l: "Name", t: "text", req: 1, v: e.name }, { k: "category", l: "Category", t: "text", req: 1, v: e.category || "Community", ph: "Community, Giveaway, Meetup…" },
      { k: "join_limit", l: "Seat limit (leave empty for no limit)", t: "number", min: 1, v: e.join_limit }, { k: "prize", l: "Prize (text)", t: "text", v: e.prize, ph: "e.g. GHS 200 + a trophy" },
      { k: "starts_at", l: "Starts", t: "datetime", req: 1, v: toLocalInput(e.starts_at) },
      { k: "cover", l: "Cover picture", t: "file", v: e.cover_url, hint: "JPG, PNG or WebP. A wide 16:9 picture looks best. It is resized for you." }]
      .concat(e.cover_url ? [{ k: "rmcover", l: "Remove the current cover", t: "checkbox" }] : []);
  }
  function evtSave(id) {
    return async function (v) {
      var row = { name: v.name, category: v.category, join_limit: v.join_limit, prize: v.prize || null, starts_at: v.starts_at };
      var oldUrl = id ? (cache.evts[id].cover_url || null) : null, newUrl = oldUrl;
      if (v.cover) newUrl = await uploadCover(v.cover); else if (v.rmcover) newUrl = null;
      row.cover_url = newUrl;
      try { if (id) await q(sb.from("events").update(row).eq("id", id)); else await q(sb.from("events").insert(row)) }
      catch (x) { if (newUrl && newUrl !== oldUrl) dropCover(newUrl); throw x }
      if (oldUrl && oldUrl !== newUrl) dropCover(oldUrl);
      toast("Saved"); setTimeout(reload, 0);
    };
  }
  acts.enew = function () { form("New event", evtFields(), "Create", evtSave(null)) };
  acts.eedit = function (el) { var e = cache.evts[el.dataset.id]; form("Edit event", evtFields(e), "Save", evtSave(e.id)) };
  acts.edel = async function (el) {
    var e = cache.evts[el.dataset.id];
    if (!await confirmDlg("Delete " + esc(e.name) + "?", "Everyone who joined is removed from it.", "Delete", true)) return;
    try { await q(sb.from("events").delete().eq("id", e.id)); dropCover(e.cover_url); toast("Deleted"); reload() } catch (x) { fail(x) }
  };

  // ---------- NEWS & NOTIFICATIONS ----------
  views.news = async function () {
    var r = await Promise.all([q(sb.from("posts").select("*").order("created_at", { ascending: false }).limit(50)), q(sb.from("notifications").select("*").order("created_at", { ascending: false }).limit(30))]);
    cache.posts = {}; r[0].forEach(function (p) { cache.posts[p.id] = p }); cache.notes = {}; r[1].forEach(function (n) { cache.notes[n.id] = n });
    main('<div class="box"><div class="hd"><h2>News &amp; announcements</h2><button class="btn" data-act="pnew">New post</button></div>' + table([
      { h: "Post", r: function (p) { return "<b>" + esc(p.title) + "</b><br>" + badge(p.kind, p.kind === "Announcement" ? "warn" : "mut") } },
      { h: "Posted", r: function (p) { return esc(fdate(p.created_at)) } },
      { h: "", r: function (p) { return '<div class="acts"><button class="btn sec sm" data-act="pedit" data-id="' + p.id + '">Edit</button><button class="btn bad sm" data-act="pdel" data-id="' + p.id + '">Delete</button></div>' } }
    ], r[0], { empty: "No posts yet." }) + "</div>" +
      '<div class="box"><div class="hd"><h2>Notifications</h2><button class="btn" data-act="nnew">Send notification</button></div>' + table([
        { h: "Message", r: function (n) { return "<b>" + esc(n.title) + '</b><br><small class="mut">' + esc(n.body) + "</small>" } },
        { h: "To", r: function (n) { return n.user_id ? "One player" : "Everyone" } },
        { h: "Type", r: function (n) { return esc(n.type) } }, { h: "Sent", r: function (n) { return esc(fdate(n.created_at)) } },
        { h: "", r: function (n) { return '<button class="btn bad sm" data-act="ndel" data-id="' + n.id + '">Delete</button>' } }
      ], r[1], { empty: "Nothing sent yet." }) + "</div>");
  };
  function postFields(p) { p = p || {}; return [{ k: "kind", l: "Type", t: "select", opts: [["News", "News"], ["Announcement", "Announcement"]], v: p.kind || "News" }, { k: "title", l: "Title", t: "text", req: 1, v: p.title }, { k: "body", l: "Text", t: "textarea", req: 1, v: p.body }] }
  function postSave(id) { return async function (v) { var row = { kind: v.kind, title: v.title, body: v.body }; if (id) await q(sb.from("posts").update(row).eq("id", id)); else await q(sb.from("posts").insert(row)); toast("Saved"); setTimeout(reload, 0) } }
  acts.pnew = function () { form("New post", postFields(), "Publish", postSave(null)) };
  acts.pedit = function (el) { var p = cache.posts[el.dataset.id]; form("Edit post", postFields(p), "Save", postSave(p.id)) };
  acts.pdel = async function (el) { var p = cache.posts[el.dataset.id]; if (!await confirmDlg("Delete this post?", esc(p.title), "Delete", true)) return; try { await q(sb.from("posts").delete().eq("id", p.id)); toast("Deleted"); reload() } catch (e) { fail(e) } };
  acts.nnew = function () {
    form("Send notification", [
      { k: "to", l: "Send to", t: "select", opts: [["all", "Everyone"], ["one", "One player"]], v: "all" },
      { k: "who", l: "Username (only if sending to one player)", t: "text" },
      { k: "type", l: "Type", t: "select", opts: [["news", "News"], ["events", "Events"], ["matches", "Matches"], ["wallet", "Wallet"], ["community", "Community"], ["account", "Account"]], v: "news" },
      { k: "title", l: "Title", t: "text", req: 1 }, { k: "body", l: "Message", t: "textarea", req: 1 }
    ], "Send", async function (v) {
      var uid = null;
      if (v.to === "one") {
        if (!v.who) throw new Error("Type the player's username");
        var u = await q(sb.from("profiles").select("id").eq("username", v.who).maybeSingle());
        if (!u) throw new Error("No player called " + v.who); uid = u.id;
      }
      await q(sb.from("notifications").insert({ user_id: uid, type: v.type, title: v.title, body: v.body })); toast(uid ? "Sent" : "Sent to everyone"); setTimeout(reload, 0);
    });
  };
  acts.ndel = async function (el) { var n = cache.notes[el.dataset.id]; if (!await confirmDlg("Delete this notification?", esc(n.title), "Delete", true)) return; try { await q(sb.from("notifications").delete().eq("id", n.id)); toast("Deleted"); reload() } catch (e) { fail(e) } };

  // ---------- CHAT ----------
  var C = { room: null };
  views.chat = async function () {
    var rooms = await q(sb.from("rooms").select("*").order("created_at"));
    cache.rooms = {}; rooms.forEach(function (r) { cache.rooms[r.id] = r });
    if (!C.room || !cache.rooms[C.room]) C.room = rooms[0] && rooms[0].id;
    main('<div class="box"><div class="hd"><h2>Rooms</h2><button class="btn" data-act="rnew">New room</button></div>' + table([
      { h: "Room", r: function (r) { return esc(r.emoji) + " <b>" + esc(r.name) + '</b><br><small class="mut">' + esc(r.description || "") + "</small>" } },
      { h: "Who can write", r: function (r) { return r.admin_only ? badge("Admins only", "warn") : badge("Everyone", "ok") } },
      { h: "", r: function (r) { return '<div class="acts"><button class="btn sec sm" data-act="rview" data-id="' + r.id + '">Messages</button><button class="btn sec sm" data-act="redit" data-id="' + r.id + '">Edit</button><button class="btn bad sm" data-act="rdel" data-id="' + r.id + '">Delete</button></div>' } }
    ], rooms, { empty: "No rooms yet." }) + '</div><div class="box" id="msgs"></div>');
    if (C.room) await showMsgs(); else $("msgs").innerHTML = '<p class="empty">Create a room to start.</p>';
  };
  async function showMsgs() {
    var r = cache.rooms[C.room], rows = await q(sb.from("messages").select("id, body, created_at, profiles(username)").eq("room_id", C.room).order("created_at", { ascending: false }).limit(50));
    $("msgs").innerHTML = '<div class="hd"><h2>' + esc(r.emoji) + " " + esc(r.name) + '</h2></div><form id="mpost" class="q" novalidate><input id="mt" placeholder="Post a message as admin…" maxlength="1000"><button class="btn" type="submit">Post</button></form>' +
      (rows.length ? rows.map(function (m) { return '<div class="msg"><div><b>' + esc(m.profiles && m.profiles.username) + '</b> <small class="mut">' + esc(fdate(m.created_at)) + "</small><p>" + esc(m.body) + '</p></div><button class="btn bad sm" data-act="mdel" data-id="' + m.id + '">Delete</button></div>' }).join("") : '<p class="empty">No messages yet.</p>');
    $("mpost").onsubmit = async function (e) { e.preventDefault(); var v = $("mt").value.trim(); if (!v) return; try { await q(sb.from("messages").insert({ room_id: C.room, body: v })); showMsgs() } catch (x) { fail(x) } };
  }
  acts.rview = function (el) { C.room = el.dataset.id; showMsgs().catch(fail) };
  acts.mdel = async function (el) { try { await q(sb.from("messages").delete().eq("id", el.dataset.id)); toast("Message deleted"); showMsgs() } catch (e) { fail(e) } };
  function roomFields(r) { r = r || {}; return [{ k: "emoji", l: "Emoji", t: "text", v: r.emoji || "💬" }, { k: "name", l: "Name", t: "text", req: 1, v: r.name }, { k: "description", l: "Description", t: "text", v: r.description }, { k: "admin_only", l: "Only admins can write here (announcements)", t: "checkbox", v: !!r.admin_only }] }
  function roomSave(id) { return async function (v) { var row = { emoji: v.emoji || "💬", name: v.name, description: v.description || null, admin_only: v.admin_only }; if (id) await q(sb.from("rooms").update(row).eq("id", id)); else await q(sb.from("rooms").insert(row)); toast("Saved"); setTimeout(reload, 0) } }
  acts.rnew = function () { form("New room", roomFields(), "Create", roomSave(null)) };
  acts.redit = function (el) { var r = cache.rooms[el.dataset.id]; form("Edit room", roomFields(r), "Save", roomSave(r.id)) };
  acts.rdel = async function (el) { var r = cache.rooms[el.dataset.id]; if (!await confirmDlg("Delete " + esc(r.name) + "?", "All messages in it are deleted too.", "Delete", true)) return; try { await q(sb.from("rooms").delete().eq("id", r.id)); toast("Deleted"); reload() } catch (e) { fail(e) } };

  // ---------- INVITES ----------
  views.invites = async function () {
    var rows = await q(sb.from("invites").select("*").order("created_at", { ascending: false }).limit(200)), ids = [];
    rows.forEach(function (i) { if (i.owner_id) ids.push(i.owner_id); if (i.used_by) ids.push(i.used_by) });
    var names = {}; if (ids.length) (await q(sb.from("profiles").select("id,username").in("id", ids))).forEach(function (p) { names[p.id] = p.username });
    cache.inv = {}; rows.forEach(function (i) { cache.inv[i.code] = i });
    main('<div class="box"><div class="hd"><h2>Invite codes</h2><button class="btn" data-act="inew">Create codes</button></div>' + table([
      { h: "Code", r: function (i) { return '<b style="letter-spacing:.08em;user-select:all">' + esc(i.code) + "</b>" } },
      { h: "Status", r: function (i) { var exp = i.status === "unused" && new Date(i.expires_at) < new Date(); return exp ? badge("expired", "warn") : stBadge(i.status) } },
      { h: "Belongs to", r: function (i) { return esc(names[i.owner_id] || "–") } }, { h: "Used by", r: function (i) { return esc(names[i.used_by] || "–") } },
      { h: "Expires", r: function (i) { return esc(fday(i.expires_at)) } }, { h: "Note", r: function (i) { return esc(i.note || "") } },
      { h: "", r: function (i) { return i.status === "unused" ? '<button class="btn bad sm" data-act="irev" data-id="' + esc(i.code) + '">Revoke</button>' : "" } }
    ], rows, { empty: "No codes yet." }) + "</div>");
  };
  function makeCode() { var A = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789", b = new Uint32Array(8); crypto.getRandomValues(b); return Array.prototype.map.call(b, function (x) { return A[x % A.length] }).join("") }
  acts.inew = function () {
    form("Create invite codes", [{ k: "n", l: "How many", t: "number", min: 1, req: 1, v: 1 }, { k: "days", l: "Valid for (days)", t: "number", min: 1, req: 1, v: 30 }, { k: "owner", l: "Give to player (username, optional)", t: "text" }, { k: "note", l: "Note", t: "text" }], "Create", async function (v) {
      if (!(v.n >= 1 && v.n <= 50)) throw new Error("Create between 1 and 50 codes at a time");
      var owner = null; if (v.owner) { var u = await q(sb.from("profiles").select("id").eq("username", v.owner).maybeSingle()); if (!u) throw new Error("No player called " + v.owner); owner = u.id }
      var exp = new Date(Date.now() + v.days * 864e5).toISOString(), rows = [];
      for (var i = 0; i < v.n; i++) rows.push({ code: makeCode(), owner_id: owner, note: v.note || null, expires_at: exp });
      await q(sb.from("invites").insert(rows)); toast(v.n + " code" + (v.n > 1 ? "s" : "") + " created"); setTimeout(reload, 0);
    });
  };
  acts.irev = async function (el) { if (!await confirmDlg("Revoke " + esc(el.dataset.id) + "?", "Nobody will be able to use this code.", "Revoke", true)) return; try { await q(sb.from("invites").update({ status: "revoked" }).eq("code", el.dataset.id)); toast("Revoked"); reload() } catch (e) { fail(e) } };

  // ---------- SETTINGS ----------
  views.settings = async function () {
    var admins = await q(sb.from("profiles").select("id,username,created_at").eq("role", "admin").order("created_at"));
    main('<div class="grid two"><div class="box"><h2>Appearance</h2><label class="chk"><input type="checkbox" id="dk"' + (document.documentElement.getAttribute("data-theme") === "dark" ? " checked" : "") + '> Dark mode for this admin page</label></div>' +
      '<div class="box"><h2>Your account</h2><dl class="kv"><dt>Signed in as</dt><dd>' + esc(me.username) + '</dd></dl><button class="btn bad" id="so2">Sign out</button></div></div>' +
      '<div class="box" style="margin-top:14px"><h2>Admin team</h2>' + table([{ h: "Admin", r: function (a) { return "<b>" + esc(a.username) + "</b>" + (a.id === me.id ? " (you)" : "") } }, { h: "Since", r: function (a) { return esc(fday(a.created_at)) } }], admins) +
      '<p class="mut" style="margin-top:10px;font-size:14px">Add or remove admins from a player\'s Manage window in Players.</p></div>' +
      '<div class="box"><h2>Good to know</h2><p class="mut" style="font-size:14px;line-height:1.6">Everything you do here is recorded in the Activity log and cannot be edited or deleted. Withdrawal controls live in Wallet. Never put your Supabase <b>secret / service_role</b> key in any file of the site.</p></div>');
    $("dk").onchange = function () { var d = this.checked; document.documentElement.setAttribute("data-theme", d ? "dark" : "light"); try { localStorage.setItem("cx_admin_theme", d ? "dark" : "light") } catch (e) { } };
    $("so2").onclick = signOut;
  };

  // ---------- events, boot ----------
  async function signOut() { try { await sb.auth.signOut() } catch (e) { } location.href = "login.html" }
  document.addEventListener("click", function (e) {
    var t = e.target.closest("[data-close],[data-act],[data-v],[data-pg]"); if (!t) return;
    if (t.hasAttribute("data-close")) { closeDlg(); return }
    if (t.dataset.pg) { if (pageFn) Promise.resolve(pageFn(Number(t.dataset.pg))).catch(fail); return }
    if (t.dataset.v) { if (t.dataset.v === cur) $("side").classList.remove("open"); else go(t.dataset.v); return }
    var fn = acts[t.dataset.act]; if (fn) { Promise.resolve(fn(t)).catch(fail) }
  });
  $("menu").onclick = function () { $("side").classList.toggle("open") };
  $("out").onclick = signOut;

  function gate(title, text, extra) { $("app").hidden = true; $("gate").hidden = false; $("gate").innerHTML = '<div class="box"><h2>' + esc(title) + "</h2><p>" + esc(text) + "</p>" + (extra || "") + "</div>" }
  (async function boot() {
    if (!sb) { gate("Setup problem", "js/supabase.js did not load. It must sit in a js folder next to this page."); return }
    try {
      var s = (await sb.auth.getSession()).data.session;
      if (!s) { location.replace("login.html?next=adim.html"); return }
      var p = await q(sb.from("profiles").select("id,username,role,status").eq("id", s.user.id).maybeSingle());
      if (!p || p.role !== "admin" || p.status !== "active") { gate("Admins only", "This account does not have admin access.", '<div class="acts" style="justify-content:center"><a class="btn sec" href="index.html">Back to the site</a><button class="btn bad" id="gso">Sign out</button></div>'); $("gso").onclick = signOut; return }
      me = p; $("who").textContent = p.username; $("av").textContent = p.username.charAt(0).toUpperCase();
      $("gate").hidden = true; $("app").hidden = false;
      drawNav(0); await go((location.hash || "").replace("#", "") || "dash"); refreshPending();
    } catch (e) { console.error(e); gate("Could not start", e.message || "Check your connection and reload.") }
  })();
})();
</script>
</body>
</html>
