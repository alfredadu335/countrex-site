<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countrex · Notifications</title>

  <style>
    /* ---------- 1. DESIGN TOKENS (colours reused everywhere) ---------- */
    :root {
      --purple: #5E3C88;
      --purple-soft: #F3EEF8;
      --ink: #1a0b2e;
      --muted: #6b6478;
      --bg: #f7f3fc;
      --white: #ffffff;
      --line: #ebe5f4;
      --green: #1fa971;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    /* ---------- 2. PHONE-WIDTH CONTAINER (same as your home page) ---------- */
    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--white);
      padding-bottom: 90px; /* room for the bottom nav */
    }

    /* ---------- 3. TOP BAR ---------- */
    .topbar {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      width: 54px; height: 54px;
      border-radius: 16px;
      background: var(--purple-soft);
      border: none;
      display: grid; place-items: center;
      font-size: 22px;
      color: var(--purple);
      cursor: pointer;
      text-decoration: none;
    }
    .topbar h1 { font-size: 26px; letter-spacing: -0.5px; flex: 1; }

    /* ---------- 4. PAGE BODY ---------- */
    .content { padding: 24px; background: linear-gradient(#f7f3fc, #fff 220px); }

    .row-between {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 16px;
    }
    .unread-count { color: var(--muted); font-size: 15px; }
    .link-btn {
      background: none; border: none;
      color: var(--purple); font-weight: 700; font-size: 15px;
      cursor: pointer;
    }

    /* Filter chips */
    .chips { display: flex; gap: 8px; overflow-x: auto; margin-bottom: 20px; }
    .chip {
      padding: 10px 18px;
      border-radius: 999px;
      border: 1.5px solid var(--line);
      background: var(--white);
      font-weight: 600; font-size: 14px;
      color: var(--ink);
      cursor: pointer;
      white-space: nowrap;
    }
    .chip.active { background: var(--purple); border-color: var(--purple); color: #fff; }

    /* ---------- 5. NOTIFICATION CARD ---------- */
    .list { display: flex; flex-direction: column; gap: 12px; }

    .notif {
      display: flex; gap: 14px;
      padding: 16px;
      border-radius: 20px;
      border: 1px solid var(--line);
      background: var(--white);
      cursor: pointer;
      position: relative;
      transition: transform .1s;
    }
    .notif:active { transform: scale(.98); }
    .notif.unread { background: var(--purple-soft); border-color: #DDD3EA; }

    .notif .ico {
      width: 46px; height: 46px; flex-shrink: 0;
      border-radius: 14px;
      background: var(--white);
      display: grid; place-items: center;
      font-size: 22px;
    }
    .notif h3 { font-size: 16px; margin-bottom: 4px; }
    .notif p  { font-size: 14px; color: var(--muted); line-height: 1.4; }
    .notif time { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); }

    /* the little green dot on unread items */
    .notif.unread::after {
      content: "";
      position: absolute; top: 18px; right: 16px;
      width: 10px; height: 10px; border-radius: 50%;
      background: var(--green);
    }

    .empty { text-align: center; color: var(--muted); padding: 48px 0; display: none; }

    /* ---------- 6. BOTTOM NAV ---------- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 600px;
      display: flex; background: var(--white);
      border-top: 1px solid var(--line);
      padding: 8px;
    }
    .bottom-nav a {
      flex: 1; text-align: center; padding: 8px 0;
      border-radius: 16px; text-decoration: none;
      font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .bottom-nav a span { display: block; font-size: 22px; }
    .bottom-nav a.active { background: var(--purple-soft); color: var(--purple); }
  
/* ----- 3-dash menu (same as the homepage) ----- */
.menu,.scrim,.burger{--bg:#FFFFFF;--ink:#1A0B2E;--muted:#6A5F7C;--line:#DDD4EA;--field:#F6F2FB;--accent:#5E3C88;--pline:#C2B2D6}
[hidden]{display:none!important}
.burger{flex:none;width:44px;height:44px;margin-left:auto;border:0;border-radius:14px;background:var(--field);cursor:pointer;position:relative}
.burger span,.burger span::before,.burger span::after{position:absolute;left:12px;width:20px;height:2.5px;border-radius:2px;background:var(--ink);content:""}
.burger span{top:20px}.burger span::before{left:0;top:-7px}.burger span::after{left:0;top:7px}
.scrim{position:fixed;inset:0;z-index:150;background:rgba(26,11,46,.45)}
.menu{position:fixed;z-index:160;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;max-height:calc(100dvh - 24px);overflow-y:auto;padding:8px 14px 14px;background:var(--bg);color:var(--ink);border-radius:28px;box-shadow:0 30px 70px -26px rgba(26,11,46,.55);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.menu a{color:inherit;text-decoration:none}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 12px}
.mbrand{font-weight:800;font-size:1.35rem;letter-spacing:-.03em}
.mclose{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:14px;background:var(--field);color:var(--ink);cursor:pointer}
.mclose svg{width:22px;height:22px}
.mprofile{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--field)}
.mav{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#7A5AAA,var(--accent));color:#fff;font-weight:800;font-size:1.3rem}
.mav svg{width:26px;height:26px}
.mwho{flex:1;min-width:0}.mwho b{display:block;font-size:1.1rem;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mwho small{color:var(--muted)}
.mgrp{margin:16px 10px 2px;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mlist{display:grid;gap:2px;margin:6px 0 0}
.mlist a{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:16px;font-weight:700;font-size:1.05rem;cursor:pointer}
.mlist a:hover{background:var(--field)}.mlist a>span:nth-child(2){flex:1}
.mlist a.danger{color:#C0213F}.mlist a.danger .mi{background:#FDE7EA;color:#C0213F}
.mi{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--field);color:var(--accent)}
.mi svg{width:22px;height:22px}
.chev{flex:none;width:18px;height:18px;color:#B8AECB}
@media (prefers-reduced-motion:no-preference){.menu{animation:mdrop .22s ease-out}}
@keyframes mdrop{from{opacity:0;transform:translate(-50%,-10px)}}
.topbar .burger{width:54px;height:54px;border-radius:16px;background:var(--purple-soft);margin-left:0}
.topbar .burger span,.topbar .burger span::before,.topbar .burger span::after{left:17px;width:20px}
.topbar .burger span{top:26px}.topbar .burger span::before{left:0}.topbar .burger span::after{left:0}
</style>

<body>
  <div class="app">

    <!-- TOP BAR: back button + title -->
    <header class="topbar">
      <a href="index.html" class="icon-btn" aria-label="Back">←</a>
      <h1>Notifications</h1>
      <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sheet"><span></span></button>
    </header>

    <main class="content">
      <!-- unread counter + mark-all button -->
      <div class="row-between">
        <span class="unread-count" id="unreadCount"></span>
        <button class="link-btn" id="markAll">Mark all as read</button>
      </div>

      <!-- filter chips -->
      <div class="chips" id="chips">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="events">Events</button>
        <button class="chip" data-filter="wallet">Wallet</button>
        <button class="chip" data-filter="community">Community</button>
      </div>

      <!-- notifications get inserted here by JavaScript -->
      <div class="list" id="list"></div>
      <p class="empty" id="empty">🎉 You're all caught up!</p>
    </main>

    <nav class="bottom-nav">
      <a href="index.html"><span>🏠</span>Home</a>
      <a href="events.html"><span>📅</span>Events</a>
      <a href="leaderboard.html"><span>🏆</span>Leaderboard</a>
      <a href="community.html"><span>👥</span>Community</a>
    </nav>
  </div>

  <script>
    // ---------- A. THE DATA ----------
    // Later you can replace this array with data from a server.
    const notifications = [
      { id: 1, type: "events",    icon: "🏆", title: "Tournament opening soon",  text: "FC27 Weekend Cup registration opens tomorrow at 6:00 PM.", time: "5 min ago",  read: false },
      { id: 2, type: "wallet",    icon: "💰", title: "Deposit successful",       text: "Your wallet was topped up with $20.00.",                   time: "1 hour ago", read: false },
      { id: 3, type: "community", icon: "💬", title: "New reply",                text: "Kwame replied to your post in the FC27 lobby.",            time: "3 hours ago",read: false },
      { id: 4, type: "events",    icon: "⏰", title: "Match reminder",           text: "Your match starts in 30 minutes. Get ready!",              time: "Yesterday",  read: true  },
      { id: 5, type: "wallet",    icon: "🎁", title: "Prize received",           text: "You won $15.00 in the Friday Night Showdown.",             time: "2 days ago", read: true  }
    ];

    let currentFilter = "all";

    // ---------- B. GRAB THE HTML ELEMENTS WE NEED ----------
    const listEl  = document.getElementById("list");
    const emptyEl = document.getElementById("empty");
    const countEl = document.getElementById("unreadCount");

    // ---------- C. DRAW THE LIST ----------
    function render() {
      // keep only the notifications that match the active chip
      const shown = notifications.filter(n => currentFilter === "all" || n.type === currentFilter);

      // build one card of HTML per notification
      listEl.innerHTML = shown.map(n => `
        <article class="notif ${n.read ? "" : "unread"}" data-id="${n.id}">
          <div class="ico">${n.icon}</div>
          <div>
            <h3>${n.title}</h3>
            <p>${n.text}</p>
            <time>${n.time}</time>
          </div>
        </article>
      `).join("");

      // show the empty message when there is nothing to display
      emptyEl.style.display = shown.length ? "none" : "block";

      // update "3 unread" text
      const unread = notifications.filter(n => !n.read).length;
      countEl.textContent = unread ? `${unread} unread` : "No unread notifications";
    }

    // ---------- D. INTERACTIONS ----------
    // Tap a card -> mark that one as read
    listEl.addEventListener("click", e => {
      const card = e.target.closest(".notif");
      if (!card) return;
      const item = notifications.find(n => n.id === Number(card.dataset.id));
      item.read = true;
      render();
    });

    // "Mark all as read" button
    document.getElementById("markAll").addEventListener("click", () => {
      notifications.forEach(n => n.read = true);
      render();
    });

    // Filter chips
    document.getElementById("chips").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentFilter = chip.dataset.filter;
      render();
    });

    // first draw when the page loads
    render();
  </script>

<script>
/* 3-DASH MENU (same as the homepage): opens, closes, and shows who is logged in. */
(function () {
  var $ = function (i) { return document.getElementById(i) };
  var burger = $("burger"), sheet = $("sheet"), scrim = $("scrim");
  function setMenu(o) { sheet.hidden = !o; scrim.hidden = !o; burger.setAttribute("aria-expanded", o) }
  burger.onclick = function () { setMenu(sheet.hidden) };
  scrim.onclick = $("mclose").onclick = function () { setMenu(false) };
  sheet.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false) });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false) });
  (async function () {
    var session = null, nm = "";
    try {
      if (typeof supabaseClient !== "undefined") {
        session = (await supabaseClient.auth.getSession()).data.session;
        if (session) {
          nm = (session.user.user_metadata || {}).username || "";
          if (!nm) { var r = await supabaseClient.from("profiles").select("username").eq("id", session.user.id).single(); nm = (r.data && r.data.username) || "" }
        }
      }
    } catch (e) { console.error(e) }
    if (session) {
      nm = nm || "Player";
      $("mav").textContent = nm.charAt(0).toUpperCase(); $("mname").textContent = nm; $("msub").textContent = "View your profile";
      $("mai").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>'; $("mal").textContent = "Log out";
      var t = $("mauth"); t.classList.add("danger"); t.removeAttribute("href"); t.setAttribute("role", "button"); t.setAttribute("tabindex", "0");
      t.onclick = async function () { try { await supabaseClient.auth.signOut() } catch (e) { } location.href = "index.html" };
      t.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t.onclick() } };
    } else { $("msign").hidden = false }
  })();
})();
</script>
