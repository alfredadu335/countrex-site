<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Countrex · Wallet</title>

  <style>
    /* ---------- 1. DESIGN TOKENS (same as notifications page) ---------- */
    :root {
      --purple: #5b2d91;
      --purple-dark: #3f1d6b;
      --purple-soft: #f1ebfa;
      --ink: #1a0b2e;
      --muted: #6b6478;
      --bg: #f7f3fc;
      --white: #ffffff;
      --line: #ebe5f4;
      --green: #1fa971;
      --red: #d64550;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
      background: var(--bg);
      color: var(--ink);
    }

    .app {
      max-width: 600px;
      margin: 0 auto;
      min-height: 100vh;
      background: var(--white);
      padding-bottom: 90px;
    }

    /* ---------- 2. TOP BAR ---------- */
    .topbar {
      display: flex; align-items: center; gap: 12px;
      padding: 16px 24px;
      border-bottom: 1px solid var(--line);
    }
    .icon-btn {
      width: 54px; height: 54px; border-radius: 16px;
      background: var(--purple-soft); border: none;
      display: grid; place-items: center;
      font-size: 22px; color: var(--purple);
      cursor: pointer; text-decoration: none;
    }
    .topbar h1 { font-size: 26px; letter-spacing: -0.5px; flex: 1; }

    .content { padding: 24px; background: linear-gradient(#f7f3fc, #fff 220px); }

    /* ---------- 3. BALANCE CARD (looks like a black bank card) ---------- */
    .bank-card {
      position: relative; overflow: hidden;
      aspect-ratio: 1.586 / 1;            /* real credit-card shape */
      border-radius: 22px;
      padding: 22px 24px;
      color: #fff;
      display: flex; flex-direction: column; justify-content: space-between;
      background:
        radial-gradient(120% 90% at 100% 0%, rgba(122, 69, 184, .55) 0%, rgba(122, 69, 184, 0) 55%),
        radial-gradient(90% 70% at 0% 100%, rgba(255, 255, 255, .07) 0%, rgba(255, 255, 255, 0) 60%),
        linear-gradient(135deg, #1b1b1f 0%, #08080a 55%, #000 100%);
      box-shadow: 0 22px 40px -18px rgba(0, 0, 0, .75), inset 0 0 0 1px rgba(255, 255, 255, .09);
    }
    /* soft diagonal shine */
    .bank-card::before {
      content: ""; position: absolute; inset: 0; pointer-events: none;
      background: linear-gradient(115deg, transparent 35%, rgba(255, 255, 255, .08) 48%, transparent 60%);
    }
    .bank-card > * { position: relative; }
    .card-top { display: flex; justify-content: space-between; align-items: center; }
    .card-brand { font-weight: 800; font-size: 20px; letter-spacing: -.5px; }
    .card-type { font-size: 11px; font-weight: 700; letter-spacing: 2px; opacity: .65; text-transform: uppercase; }
    .card-mid { display: flex; align-items: center; justify-content: space-between; }
    .chip-ic {
      width: 46px; height: 34px; border-radius: 7px;
      background:
        linear-gradient(90deg, transparent 33%, rgba(0,0,0,.28) 33% 35%, transparent 35% 65%, rgba(0,0,0,.28) 65% 67%, transparent 67%),
        linear-gradient(0deg, transparent 45%, rgba(0,0,0,.28) 45% 55%, transparent 55%),
        linear-gradient(135deg, #f2d98b, #c9a24a 55%, #e8cb7d);
      box-shadow: inset 0 0 0 1px rgba(0,0,0,.25);
    }
    .nfc { width: 28px; height: 28px; opacity: .8; }
    .card-bal .label { font-size: 11px; letter-spacing: 1.5px; text-transform: uppercase; opacity: .65; }
    .card-bal .row { display: flex; align-items: center; gap: 8px; }
    .eye {
      width: 30px; height: 30px; border: 0; border-radius: 50%; cursor: pointer;
      display: grid; place-items: center; padding: 0;
      background: rgba(255,255,255,.14); color: #fff;
    }
    .eye:hover { background: rgba(255,255,255,.24); }
    .eye:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .eye svg { width: 18px; height: 18px; }
    .eye .off { display: none; }
    .eye.is-hidden .on { display: none; }
    .eye.is-hidden .off { display: block; }
    .card-bal .amount {
      font-size: 36px; font-weight: 800; letter-spacing: -1px; line-height: 1.1;
      font-variant-numeric: tabular-nums;
    }
    .actions { display: flex; gap: 12px; margin-top: 16px; }
    .actions button {
      flex: 1; padding: 15px;
      border-radius: 999px; border: none;
      font-weight: 700; font-size: 15px; cursor: pointer;
    }
    .btn-light { background: var(--purple); color: #fff; box-shadow: 0 10px 20px -10px var(--purple); }
    .btn-ghost { background: var(--purple-soft); color: var(--purple); }

    /* ---------- 4. QUICK STATS ---------- */
    .stats { display: flex; gap: 12px; margin: 20px 0 28px; }
    .stat {
      flex: 1; padding: 16px;
      border: 1px solid var(--line);
      border-radius: 20px;
    }
    .stat small { color: var(--muted); font-size: 13px; }
    .stat strong { display: block; font-size: 22px; margin-top: 4px; }
    .stat.in strong  { color: var(--green); }
    .stat.out strong { color: var(--red); }

    /* ---------- 5. TRANSACTIONS ---------- */
    h2 { font-size: 24px; letter-spacing: -0.5px; margin-bottom: 12px; }

    .chips { display: flex; gap: 8px; margin-bottom: 16px; }
    .chip {
      padding: 10px 18px; border-radius: 999px;
      border: 1.5px solid var(--line); background: #fff;
      font-weight: 600; font-size: 14px; cursor: pointer;
    }
    .chip.active { background: var(--purple); border-color: var(--purple); color: #fff; }

    .day { margin: 12px 0 0; font-size: 13px; font-weight: 700; color: var(--muted); }
    .tx-list { display: flex; flex-direction: column; gap: 10px; }
    .tx {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px;
      border: 1px solid var(--line); border-radius: 20px;
    }
    .tx .ico {
      width: 44px; height: 44px; border-radius: 14px;
      background: var(--purple-soft);
      display: grid; place-items: center; font-size: 20px;
    }
    .tx .info { flex: 1; }
    .tx .info h4 { font-size: 15px; }
    .tx .info small { color: var(--muted); font-size: 12px; }
    .tx .amt { font-weight: 800; font-size: 16px; }
    .tx .amt.plus  { color: var(--green); }
    .tx .amt.minus { color: var(--red); }

    /* ---------- 6. POP-UP (modal) for Add / Withdraw ---------- */
    .overlay {
      position: fixed; inset: 0;
      background: rgba(26, 11, 46, .55);
      display: none; align-items: flex-end; justify-content: center;
      z-index: 10;
    }
    .overlay.open { display: flex; }
    .sheet {
      width: 100%; max-width: 600px;
      background: #fff; border-radius: 28px 28px 0 0;
      padding: 28px 24px 32px;
    }
    .sheet h3 { font-size: 22px; margin-bottom: 16px; }
    .sheet input {
      width: 100%; padding: 16px;
      font-size: 20px; font-weight: 700;
      border: 2px solid var(--line); border-radius: 16px;
      outline: none;
    }
    .sheet input:focus { border-color: var(--purple); }
    .quick { display: flex; gap: 8px; margin: 12px 0 18px; }
    .quick button {
      flex: 1; padding: 10px; border-radius: 999px;
      border: 1.5px solid var(--line); background: #fff;
      font-weight: 600; cursor: pointer;
    }
    .error { color: var(--red); font-size: 14px; min-height: 20px; margin-top: 8px; }
    .sheet .confirm {
      width: 100%; padding: 16px; border: none; border-radius: 999px;
      background: var(--purple); color: #fff;
      font-weight: 700; font-size: 16px; cursor: pointer;
    }
    .sheet .cancel {
      width: 100%; margin-top: 10px; padding: 14px;
      background: none; border: none; color: var(--muted);
      font-weight: 600; cursor: pointer;
    }

    /* ---------- 7. BOTTOM NAV ---------- */
    .bottom-nav {
      position: fixed; bottom: 0; left: 50%; transform: translateX(-50%);
      width: 100%; max-width: 600px;
      display: flex; background: #fff;
      border-top: 1px solid var(--line); padding: 8px;
    }
    .bottom-nav a {
      flex: 1; text-align: center; padding: 8px 0;
      border-radius: 16px; text-decoration: none;
      font-size: 13px; font-weight: 600; color: var(--muted);
    }
    .bottom-nav a span { display: block; font-size: 22px; }
  
/* ----- 3-dash menu (same as the homepage) ----- */
.menu,.scrim,.burger{--bg:#FFFFFF;--ink:#1A0B2E;--muted:#6A5F7C;--line:#DDD4EA;--field:#F6F2FB;--accent:#5B2C8F;--pline:#BBA0DA}
[hidden]{display:none!important}
.burger{flex:none;width:44px;height:44px;margin-left:auto;border:0;border-radius:14px;background:var(--field);cursor:pointer;position:relative}
.burger span,.burger span::before,.burger span::after{position:absolute;left:12px;width:20px;height:2.5px;border-radius:2px;background:var(--ink);content:""}
.burger span{top:20px}.burger span::before{left:0;top:-7px}.burger span::after{left:0;top:7px}
.scrim{position:fixed;inset:0;z-index:150;background:rgba(26,11,46,.45)}
.menu{position:fixed;z-index:160;top:12px;left:50%;transform:translateX(-50%);width:calc(100% - 24px);max-width:456px;max-height:calc(100dvh - 24px);overflow-y:auto;padding:8px 14px 14px;background:var(--bg);color:var(--ink);border-radius:28px;box-shadow:0 30px 70px -26px rgba(26,11,46,.55);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.4}
.menu a{color:inherit;text-decoration:none}
.mhead{display:flex;align-items:center;justify-content:space-between;padding:8px 6px 12px}
.mbrand{font-weight:800;font-size:1.35rem;letter-spacing:-.03em}
.mclose{display:grid;place-items:center;width:42px;height:42px;border:0;border-radius:14px;background:var(--field);color:var(--ink);cursor:pointer}
.mclose svg{width:22px;height:22px}
.mprofile{display:flex;align-items:center;gap:14px;padding:14px;border-radius:22px;background:var(--field)}
.mav{flex:none;display:grid;place-items:center;width:52px;height:52px;border-radius:50%;background:linear-gradient(135deg,#7A45B8,var(--accent));color:#fff;font-weight:800;font-size:1.3rem}
.mav svg{width:26px;height:26px}
.mwho{flex:1;min-width:0}.mwho b{display:block;font-size:1.1rem;letter-spacing:-.01em;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.mwho small{color:var(--muted)}
.mgrp{margin:16px 10px 2px;font-size:.74rem;font-weight:800;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.mlist{display:grid;gap:2px;margin:6px 0 0}
.mlist a{display:flex;align-items:center;gap:14px;padding:10px 8px;border-radius:16px;font-weight:700;font-size:1.05rem;cursor:pointer}
.mlist a:hover{background:var(--field)}.mlist a>span:nth-child(2){flex:1}
.mlist a.danger{color:#C0213F}.mlist a.danger .mi{background:#FDE7EA;color:#C0213F}
.mi{flex:none;display:grid;place-items:center;width:42px;height:42px;border-radius:13px;background:var(--field);color:var(--accent)}
.mi svg{width:22px;height:22px}
.chev{flex:none;width:18px;height:18px;color:#B8AECB}
@media (prefers-reduced-motion:no-preference){.menu{animation:mdrop .22s ease-out}}
@keyframes mdrop{from{opacity:0;transform:translate(-50%,-10px)}}
.topbar .burger{width:54px;height:54px;border-radius:16px;background:var(--purple-soft);margin-left:0}
.topbar .burger span,.topbar .burger span::before,.topbar .burger span::after{left:17px;width:20px}
.topbar .burger span{top:26px}.topbar .burger span::before{left:0}.topbar .burger span::after{left:0}
</style>

<body>
  <div class="app">

    <header class="topbar">
      <a href="index.html" class="icon-btn" aria-label="Back">←</a>
      <h1>Wallet</h1>
      <a href="notifications.html" class="icon-btn" aria-label="Notifications">🔔</a>
      <button class="burger" id="burger" type="button" aria-label="Menu" aria-expanded="false" aria-controls="sheet"><span></span></button>
    </header>

    <main class="content">

      <!-- Bank-style balance card -->
      <section class="bank-card" aria-label="Wallet card">
        <div class="card-top">
          <span class="card-brand">Countrex</span>
          <span class="card-type">Wallet</span>
        </div>
        <div class="card-mid">
          <span class="chip-ic" aria-hidden="true"></span>
          <svg class="nfc" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M7 7c2.5 3 2.5 7 0 10"/><path d="M11 5c3.8 4.3 3.8 9.7 0 14"/><path d="M15 3c5 5.6 5 12.4 0 18"/></svg>
        </div>
        <div class="card-bal">
          <div class="row">
            <div class="label">Available balance</div>
            <button class="eye" id="eyeBtn" type="button" aria-label="Hide balance" aria-pressed="false">
              <svg class="on" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
              <svg class="off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.9 17.9A10.4 10.4 0 0 1 12 19C5.6 19 2 12 2 12a18 18 0 0 1 4.1-5M9.9 5.2A9.7 9.7 0 0 1 12 5c6.4 0 10 7 10 7a18 18 0 0 1-2.2 3.2M14.1 14.1a3 3 0 0 1-4.2-4.2"/><path d="M2 2l20 20"/></svg>
            </button>
          </div>
          <div class="amount" id="balance">$0.00</div>
        </div>
      </section>

      <div class="actions">
        <button class="btn-light" id="openAdd">＋ Add money</button>
        <button class="btn-ghost" id="openWithdraw">Withdraw</button>
      </div>

      <!-- Money in / money out -->
      <section class="stats">
        <div class="stat in"><small>Received</small><strong id="totalIn">$0.00</strong></div>
        <div class="stat out"><small>Spent</small><strong id="totalOut">$0.00</strong></div>
      </section>

      <!-- Transactions -->
      <h2>Transaction history</h2>
      <div class="chips" id="chips">
        <button class="chip active" data-filter="all">All</button>
        <button class="chip" data-filter="in">Received</button>
        <button class="chip" data-filter="out">Spent</button>
      </div>
      <div class="tx-list" id="txList"></div>
    </main>

    <!-- Pop-up used by both Add money and Withdraw -->
    <div class="overlay" id="overlay">
      <div class="sheet">
        <h3 id="sheetTitle">Add money</h3>
        <input type="number" id="amountInput" placeholder="0.00" min="1" step="0.01" />
        <div class="quick">
          <button data-amt="5">$5</button>
          <button data-amt="10">$10</button>
          <button data-amt="20">$20</button>
          <button data-amt="50">$50</button>
        </div>
        <div class="error" id="error"></div>
        <button class="confirm" id="confirmBtn">Confirm</button>
        <button class="cancel" id="cancelBtn">Cancel</button>
      </div>
    </div>

    <nav class="bottom-nav">
      <a href="index.html"><span>🏠</span>Home</a>
      <a href="events.html"><span>📅</span>Events</a>
      <a href="leaderboard.html"><span>🏆</span>Leaderboard</a>
      <a href="community.html"><span>👥</span>Community</a>
    </nav>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script src="js/supabase.js"></script>
  <script>
    // ---------- A. SETTINGS + DATA ----------
    const CURRENCY = "$";   // change to "₵" or anything else in one place

    // positive amount = money in, negative = money out
    let transactions = [
      { id: 1, icon: "🎁", title: "Prize: Friday Night Showdown", sub: "eFootball · 1st place",  date: "2 Nov",  time: "21:14", amount:  15 },
      { id: 2, icon: "🎟️", title: "FC27 Weekend Cup entry",       sub: "Tournament entry",       date: "1 Nov",  time: "18:02", amount:  -5 },
      { id: 3, icon: "🎁", title: "Prize: CODM Squad Clash",      sub: "Call of Duty: Mobile · 3rd place", date: "31 Oct", time: "22:40", amount: 8 },
      { id: 4, icon: "🎟️", title: "CODM Squad Clash entry",       sub: "Tournament entry",       date: "31 Oct", time: "19:30", amount:  -3 },
      { id: 5, icon: "💳", title: "Wallet top-up",                sub: "Added to wallet",        date: "30 Oct", time: "16:45", amount:  20 },
      { id: 6, icon: "🏦", title: "Withdrawal",                   sub: "Sent to your account",   date: "28 Oct", time: "12:10", amount: -10 },
      { id: 7, icon: "🎁", title: "Prize: eFootball Midweek Cup", sub: "eFootball · 2nd place",  date: "26 Oct", time: "20:55", amount:  10 },
      { id: 8, icon: "💳", title: "Wallet top-up",                sub: "Added to wallet",        date: "25 Oct", time: "09:20", amount:  15 }
    ];

    let currentFilter = "all";
    // remember the eye setting on this device
    let hideBalance = false;
    try { hideBalance = localStorage.getItem("countrex_hide_balance") === "1"; } catch (e) {}
    let mode = "add";       // "add" or "withdraw" — which action the pop-up is doing

    // ---------- B. HELPERS ----------
    const $ = id => document.getElementById(id);
    const money = n => CURRENCY + Math.abs(n).toFixed(2);

    // ---------- C. DRAW THE PAGE ----------
    function render() {
      // add up everything for the balance
      const totalIn  = transactions.filter(t => t.amount > 0).reduce((s, t) => s + t.amount, 0);
      const totalOut = transactions.filter(t => t.amount < 0).reduce((s, t) => s + t.amount, 0);

      const show = v => hideBalance ? CURRENCY + "••••" : v;
      $("balance").textContent  = show(money(totalIn + totalOut));
      $("totalIn").textContent  = show(money(totalIn));
      $("totalOut").textContent = show(money(totalOut));

      // filter by chip
      const shown = transactions.filter(t =>
        currentFilter === "all" ||
        (currentFilter === "in"  && t.amount > 0) ||
        (currentFilter === "out" && t.amount < 0)
      );

      // group by day: a small date heading, then that day's transactions
      let html = "", lastDate = "";
      shown.forEach(t => {
        if (t.date !== lastDate) {
          html += `<div class="day">${t.date}</div>`;
          lastDate = t.date;
        }
        html += `
        <div class="tx">
          <div class="ico">${t.icon}</div>
          <div class="info"><h4>${t.title}</h4><small>${t.sub} · ${t.time}</small></div>
          <div class="amt ${t.amount > 0 ? "plus" : "minus"}">
            ${t.amount > 0 ? "+" : "−"}${money(t.amount)}
          </div>
        </div>`;
      });
      $("txList").innerHTML = html || '<p style="color:var(--muted);text-align:center;padding:30px 0">No transactions yet</p>';
    }

    // ---------- D. POP-UP OPEN / CLOSE ----------
    function openSheet(newMode) {
      mode = newMode;
      $("sheetTitle").textContent = mode === "add" ? "Add money" : "Withdraw";
      $("amountInput").value = "";
      $("error").textContent = "";
      $("overlay").classList.add("open");
      $("amountInput").focus();
    }
    function closeSheet() { $("overlay").classList.remove("open"); }

    $("openAdd").onclick      = () => openSheet("add");
    $("openWithdraw").onclick = () => openSheet("withdraw");
    $("cancelBtn").onclick    = closeSheet;

    // quick-amount buttons fill the input
    document.querySelectorAll(".quick button").forEach(b => {
      b.onclick = () => $("amountInput").value = b.dataset.amt;
    });

    // ---------- E. CONFIRM (the important logic) ----------
    $("confirmBtn").onclick = () => {
      const value = parseFloat($("amountInput").value);
      const balance = transactions.reduce((s, t) => s + t.amount, 0);

      // validation
      if (!value || value <= 0)                 return $("error").textContent = "Enter an amount greater than 0.";
      if (mode === "withdraw" && value > balance) return $("error").textContent = "You don't have enough balance.";

      // add a new transaction to the TOP of the list
      transactions.unshift({
        id: Date.now(),
        icon: mode === "add" ? "💳" : "🏦",
        title: mode === "add" ? "Wallet top-up" : "Withdrawal",
        sub: mode === "add" ? "Added to wallet" : "Sent to your account",
        date: "Today",
        time: new Date().toLocaleTimeString("en-GB", { hour: "2-digit", minute: "2-digit" }),
        amount: mode === "add" ? value : -value
      });

      closeSheet();
      render();
    };

    // ---------- F. FILTER CHIPS ----------
    $("chips").addEventListener("click", e => {
      const chip = e.target.closest(".chip");
      if (!chip) return;
      document.querySelectorAll(".chip").forEach(c => c.classList.remove("active"));
      chip.classList.add("active");
      currentFilter = chip.dataset.filter;
      render();
    });

    // ---------- EYE: hide / show the balance ----------
    function paintEye() {
      const b = $("eyeBtn");
      b.classList.toggle("is-hidden", hideBalance);
      b.setAttribute("aria-pressed", hideBalance);
      b.setAttribute("aria-label", hideBalance ? "Show balance" : "Hide balance");
    }
    $("eyeBtn").onclick = () => {
      hideBalance = !hideBalance;
      try { localStorage.setItem("countrex_hide_balance", hideBalance ? "1" : "0"); } catch (e) {}
      paintEye();
      render();
    };
    paintEye();
    render();

  </script>

<script>
/* 3-DASH MENU (same as the homepage): opens, closes, and shows who is logged in. */
(function () {
  var $ = function (i) { return document.getElementById(i) };
  var burger = $("burger"), sheet = $("sheet"), scrim = $("scrim");
  function setMenu(o) { sheet.hidden = !o; scrim.hidden = !o; burger.setAttribute("aria-expanded", o) }
  burger.onclick = function () { setMenu(sheet.hidden) };
  scrim.onclick = $("mclose").onclick = function () { setMenu(false) };
  sheet.addEventListener("click", function (e) { if (e.target.closest("a")) setMenu(false) });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") setMenu(false) });
  (async function () {
    var session = null, nm = "";
    try {
      if (typeof supabaseClient !== "undefined") {
        session = (await supabaseClient.auth.getSession()).data.session;
        if (session) {
          nm = (session.user.user_metadata || {}).username || "";
          if (!nm) { var r = await supabaseClient.from("profiles").select("username").eq("id", session.user.id).single(); nm = (r.data && r.data.username) || "" }
        }
      }
    } catch (e) { console.error(e) }
    if (session) {
      nm = nm || "Player";
      $("mav").textContent = nm.charAt(0).toUpperCase(); $("mname").textContent = nm; $("msub").textContent = "View your profile";
      $("mai").innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4H6a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h3"/><path d="M16 8l4 4-4 4M20 12H9"/></svg>'; $("mal").textContent = "Log out";
      var t = $("mauth"); t.classList.add("danger"); t.removeAttribute("href"); t.setAttribute("role", "button"); t.setAttribute("tabindex", "0");
      t.onclick = async function () { try { await supabaseClient.auth.signOut() } catch (e) { } location.href = "index.html" };
      t.onkeydown = function (e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); t.onclick() } };
    } else { $("msign").hidden = false }
  })();
})();
</script>
